<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- "Add to Home Screen" opens the prototype full screen, under the real status bar -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Apple Sports – NBA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone" aria-label="Apple Sports">
    <!-- Status bar -->
    <header class="status-bar">
      <span class="status-time">1:46</span>
      <div class="status-icons" aria-hidden="true">
        <!-- Cellular -->
        <svg width="18" height="12" viewBox="0 0 18 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="1" fill="#fff" />
          <rect x="4.8" y="5" width="3.2" height="7" rx="1" fill="#fff" />
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="1" fill="#fff" />
          <rect x="14.4" y="0" width="3.2" height="12" rx="1" fill="#fff" />
        </svg>
        <!-- Wi-Fi -->
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path fill="#fff" d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5.1.1.3.1.4 0l1.2-1.2c.1-.1.1-.3 0-.4C14.3 1.2 11.5 0 8.5 0S2.7 1.2.6 3.2c-.1.1-.1.3 0 .4l1.2 1.2c.1.1.3.1.4 0C3.9 3.2 6.1 2.3 8.5 2.3z" />
          <path fill="#fff" d="M8.5 6c1.3 0 2.6.5 3.6 1.4.1.1.3.1.4 0l1.2-1.2c.1-.1.1-.3 0-.4-1.4-1.3-3.2-2-5.2-2s-3.8.7-5.2 2c-.1.1-.1.3 0 .4l1.2 1.2c.1.1.3.1.4 0C5.9 6.5 7.2 6 8.5 6z" />
          <path fill="#fff" d="M10.8 8.9c.1-.1.1-.3 0-.4-.6-.5-1.4-.8-2.3-.8s-1.7.3-2.3.8c-.1.1-.1.3 0 .4l2.1 2.1c.1.1.3.1.4 0l2.1-2.1z" />
        </svg>
        <!-- Battery -->
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="22.5" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity="0.4" />
          <rect x="2" y="2" width="19.5" height="9" rx="2.5" fill="#fff" />
          <path d="M24.5 4.3v4.4c.9-.4 1.5-1.2 1.5-2.2s-.6-1.8-1.5-2.2z" fill="#fff" fill-opacity="0.45" />
        </svg>
      </div>
    </header>

    <!-- App header -->
    <div class="app-header">
      <h1 class="brand">
        <svg class="apple-logo" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#fff" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" />
        </svg>
        <span>Sports</span>
      </h1>
      <button class="league-pill" id="league-pill" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="league-menu">
        <img src="logos/nba-logoman.svg" alt="" class="league-logo" />
        <span>NBA</span>
      </button>
    </div>

    <!-- League / team menu (expands out of the NBA button) -->
    <div class="menu-scrim" id="menu-scrim"></div>
    <nav class="league-menu" id="league-menu" aria-label="Leagues and teams">
      <div class="menu-top">
        <span class="menu-avatar" aria-hidden="true"></span>
        <button class="menu-icon-button" type="button" aria-label="Settings">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button class="menu-edit" type="button">Edit</button>
      </div>
      <ul class="menu-items">
        <li>
          <button class="menu-item" type="button">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="7" />
              <path d="M15.6 15.6 21 21" />
            </svg>
            Search
          </button>
        </li>
        <li>
          <button class="menu-item" type="button">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.5 10.2 12 3l8.5 7.2V20a1 1 0 0 1-1 1H15v-6.5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1V21H4.5a1 1 0 0 1-1-1z" />
            </svg>
            Home
          </button>
        </li>
        <li>
          <button class="menu-item" type="button">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M12 2.6l2.85 5.95 6.55.85-4.8 4.55 1.2 6.5L12 17.3l-5.8 3.15 1.2-6.5-4.8-4.55 6.55-.85z" />
            </svg>
            My Teams
          </button>
        </li>
        <li>
          <button class="menu-item is-selected" type="button" aria-current="true">
            <img class="menu-icon menu-icon--league" src="logos/nba-logoman.svg" alt="" />
            NBA
          </button>
        </li>
        <li>
          <button class="menu-item" type="button" data-team="warriors">
            <img class="menu-icon" src="logos/warriors.svg" alt="" />
            Warriors
          </button>
        </li>
        <li>
          <button class="menu-item" type="button" data-team="heat">
            <img class="menu-icon" src="logos/heat.svg" alt="" />
            Heat
          </button>
        </li>
      </ul>
    </nav>

    <!-- Game sheet: slides up when a matchup with details is tapped -->
    <div class="sheet-scrim" id="sheet-scrim"></div>
    <p class="sheet-date" id="sheet-date" aria-hidden="true"></p>
    <section class="sheet" id="game-sheet" role="dialog" aria-modal="true" aria-hidden="true" inert>
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"><span class="sheet-grabber"></span></div>
      <button class="sheet-action" type="button" aria-label="Share">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19.5V5M5.5 11.5 12 5l6.5 6.5" />
        </svg>
      </button>
      <!-- Pages inside the sheet: the game, and a team page pushed over it -->
      <div class="sheet-page sheet-page--game" id="game-page">
        <div class="sheet-body" id="sheet-body"></div>
      </div>
      <div class="sheet-page sheet-page--team" id="team-page" inert>
        <button class="sheet-back" id="sheet-back" type="button" aria-label="Back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 5.5 8 12l6.5 6.5" />
          </svg>
        </button>
        <h2 class="sheet-page-title" id="team-title"></h2>
        <div class="sheet-body" id="team-body"></div>
      </div>
    </section>

    <!-- Scores card -->
    <section class="card">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="previous">Previous</button>
        <button class="tab is-active" role="tab" data-tab="today" aria-selected="true">Today</button>
        <button class="tab" role="tab" data-tab="upcoming">Upcoming</button>
      </nav>
      <ul class="games" id="games"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
